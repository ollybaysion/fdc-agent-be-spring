# 환경 변수 이름 계약은 그대로 유지한다 (FE·배포와의 계약) —
# 같은 .env 로 두 서버를 나란히 띄워 패리티 비교/스왑이 가능하도록.
server:
  port: ${PORT:8080}
  address: ${HOST:0.0.0.0}

spring:
  application:
    name: fdc-agent-be
  threads:
    virtual:
      enabled: true # SSE 문자 스트리밍·에이전트 루프의 blocking 을 가상 스레드로.

logging:
  level:
    root: ${LOG_LEVEL:info}

fdc:
  # development | production | restricted (NODE_ENV 계약 유지)
  env: ${NODE_ENV:development}
  # fixture(Phase 0) | oracle(Phase 1)
  data-source: ${DATA_SOURCE:fixture}
  oracle:
    user: ${ORACLE_USER:}
    password: ${ORACLE_PASSWORD:}
    connect-string: ${ORACLE_CONNECT_STRING:}
    pool-min: ${ORACLE_POOL_MIN:2}
    pool-max: ${ORACLE_POOL_MAX:10}
  llm:
    base-url: ${LLM_BASE_URL:}
    api-key: ${LLM_API_KEY:}
    model: ${LLM_MODEL:}
    # 한 호출의 응답 대기 상한(초). 온프렘 GW 가 답을 안 줘도 요청이 풀리게.
    timeout-seconds: ${LLM_TIMEOUT_SECONDS:60}
  # 채팅 SSE 타이핑 연출 — 글자 간격과, 그 연출이 응답을 붙드는 총 시간의 상한.
  chat:
    token-interval-ms: ${CHAT_TOKEN_INTERVAL_MS:15}
    max-stream-delay-ms: ${CHAT_MAX_STREAM_DELAY_MS:3000}
  # akg 지식 허브(#8) — URL(+필요시 토큰)만 넣으면 도메인 스킬을 허브에서
  # 런타임 fetch 한다. 비어 있으면 classpath 번들 스킬만 사용(기존 동작).
  akg:
    url: ${AKG_URL:}
    token: ${AKG_TOKEN:}
    refresh-seconds: ${AKG_REFRESH_SECONDS:300}
